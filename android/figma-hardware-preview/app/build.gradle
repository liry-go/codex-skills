plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.local.figmapreview'
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId 'dev.local.figmapreview'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            // ADB run-as imports previews into this app's private storage.
            debuggable true
        }
    }
}
